<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hollow Island · Island notes</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #1c1c1c; background: #fafaf7; }
      body { margin: 0; }
      header { max-width: 44rem; margin: 0 auto; padding: 1.25rem 1rem; }
      header a { color: #2f7d4f; }
      main { max-width: 44rem; margin: 0 auto; padding: 1.25rem 1rem; }
      /* Intentional, for Impeccable's test drive: gradient text on the heading. */
      h1 {
        font-size: 2.5rem; margin: 2rem 0 1rem;
        background: linear-gradient(90deg, #2f7d4f, #c2410c);
        -webkit-background-clip: text; background-clip: text;
        color: transparent; -webkit-text-fill-color: transparent;
      }
      /* Intentional, for Impeccable's test drive: low-contrast text (#c8c8c8 on near-white). */
      .lede { color: #c8c8c8; font-size: 1.1rem; line-height: 1.5; }
      /* Intentional, for Impeccable's test drive: link text under the 11px floor. */
      .small-link { font-size: 10px; color: #2f7d4f; }
      /* Intentional, for Impeccable's test drive: layout property in a transition. */
      .bar { height: 0.75rem; width: 30%; background: #2f7d4f; border-radius: 0.4rem; transition: width 0.3s; }
      .bar:hover { width: 90%; }
      /* Intentional, for Impeccable's test drive: body text flush with the viewport edges, no background. */
      .edge { margin: 2rem calc(50% - 50vw); padding: 0; line-height: 1.5; }
    </style>
  </head>
  <body>
    <header><a href="/">Hollow Island</a></header>
    <main>
      <h1>Island notes</h1>
      <p class="lede">Short notes from the island: what changed this week, and what is coming up next on the list.</p>
      <div class="bar" aria-hidden="true"></div>
      <a class="small-link" href="/#live">Back to the live list</a>
      <p class="edge">The tide tables, the ferry times and the lighthouse hours all live on this one page for now.</p>
    </main>
  </body>
</html>
